<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartStudy | Create Account</title>
<link rel="stylesheet" href="assets/style.css">
<style>
.text-link{color:#5a52c3;font-weight:800;text-decoration:none}.text-link:hover{text-decoration:underline}
.helper{font-size:12px;color:#8791a4;margin-top:6px}.success{color:#27804d;background:#e9f8ef;border-radius:10px;padding:10px 12px;font-size:13px}
</style>
</head>
<body class="login-body">
<main class="login-wrap">
<section class="login-card">
<div class="brand-mark">✦</div>
<p class="eyebrow">SMART AI STUDY PLANNER</p>
<h1>Create your account</h1>
<p class="muted">Add a student profile to start a personalized learning pathway.</p>

<form id="registerForm" novalidate>
<label>Full Name
<input id="name" type="text" maxlength="100" placeholder="e.g. Ananya Kumar" required>
</label>
<label>Email
<input id="email" type="email" maxlength="150" placeholder="e.g. ananya@example.com" required>
</label>
<label>Course
<input id="course" type="text" maxlength="100" placeholder="e.g. B.Tech IT" required>
</label>
<label>Year
<select id="year" required>
<option value="">Select year</option>
<option value="1">1st Year</option>
<option value="2">2nd Year</option>
<option value="3">3rd Year</option>
<option value="4">4th Year</option>
</select>
</label>
<label>Learning Goal
<input id="goal" type="text" maxlength="255" placeholder="e.g. Improve programming skills" required>
</label>

<button id="registerButton" class="primary" type="submit">Create Student Account</button>
<p id="registerError" class="error" hidden></p>
<p id="registerSuccess" class="success" hidden></p>
</form>

<p class="login-note">Already registered? <a class="text-link" href="index.html">Back to Login</a></p>
</section>
</main>

<script src="assets/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('registerForm');
  const button = document.getElementById('registerButton');
  const error = document.getElementById('registerError');
  const success = document.getElementById('registerSuccess');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    error.hidden = true;
    success.hidden = true;

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim().toLowerCase();
    const course = document.getElementById('course').value.trim();
    const year = document.getElementById('year').value;
    const goal = document.getElementById('goal').value.trim();

    if (!name || !email || !course || !year || !goal) {
      error.textContent = 'Please complete all fields.';
      error.hidden = false;
      return;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      error.textContent = 'Please enter a valid email address.';
      error.hidden = false;
      return;
    }

    button.disabled = true;
    button.textContent = 'Creating account…';

    try {
      const result = await API.post('/students', {
        name, email, course, year: Number(year), goal
      });

      sessionStorage.setItem('student', JSON.stringify(result.student));
      success.textContent = 'Account created successfully. Opening your dashboard…';
      success.hidden = false;

      setTimeout(() => {
        location.href = 'dashboard.html';
      }, 600);
    } catch (ex) {
      error.textContent = ex.message || 'Unable to create the account.';
      error.hidden = false;
    } finally {
      button.disabled = false;
      button.textContent = 'Create Student Account';
    }
  });
});
</script>
</body>
</html>
