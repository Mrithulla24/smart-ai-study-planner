<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subjects | SmartStudy</title><link rel="stylesheet" href="assets/style.css"></head><body><script src="assets/app.js"></script><script>const page=shell('subjects','Subjects','Your current subjects and topics.');(async()=>{try{const rows=await API.get('/subjects');page.innerHTML=`<div class="grid grid-3">${rows.map(x=>`<article class="card"><div class="section-head"><div class="subject-title">${esc(x.subject_name)}</div><span class="badge ${esc(x.priority)}">${esc(x.priority)}</span></div><p class="meta">${esc(x.topic)}</p><p class="muted small">Subject ID: ${x.subject_id}</p></article>`).join('')}</div>`}catch(e){page.innerHTML=`<div class="card error">${esc(e.message)}</div>`}})();</script></body></html>
