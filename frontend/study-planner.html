<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Planner | SmartStudy</title><link rel="stylesheet" href="assets/style.css"></head><body><script src="assets/app.js"></script><script>const page=shell('planner','Study Planner','');async function load(){try{const rows=await API.get('/study-plan/'+student().student_id);page.innerHTML=`<section class="card"><div class="section-head"><div><h2>My Study Plan</h2></div><button id="generate" class="primary" style="width:auto">Generate with AI</button></div><div id="msg"></div><div class="table-wrap" style="margin-top:15px"><table class="table"><thead><tr><th>Subject</th><th>Hours</th><th>Priority</th><th>Status</th><th>Recommendation</th><th>Action</th></tr></thead><tbody>${rows.map(x=>`<tr><td><strong>${esc(x.subject_name)}</strong><div class="small muted">${esc(x.topic)}</div></td><td>${x.recommended_hours}</td><td><span class="badge ${esc(x.priority)}">${esc(x.priority)}</span></td><td><span class="badge ${esc(x.status)}">${esc(x.status)}</span></td><td>${esc(x.recommendation)}</td><td><a class="secondary" href="study-session.html?plan_id=${x.plan_id}">Start Studying</a></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No study plans yet. Generate one with AI.</td></tr>'}</tbody></table></div></section>`;document.getElementById('generate').onclick=async()=>{const b=document.getElementById('generate');setBusy(b,true,'Generating…');try{const r=await API.post('/generate-study-plan/'+student().student_id,{});document.getElementById('msg').innerHTML=`<p class="small muted">${esc(r.message)}</p>`;await load()}catch(e){document.getElementById('msg').innerHTML=`<p class="error">${esc(e.message)}</p>`}finally{if(document.getElementById('generate'))setBusy(document.getElementById('generate'),false)}}}catch(e){page.innerHTML=`<div class="card error">${esc(e.message)}</div>`}}load();</script></body></html>
