<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile | SmartStudy</title><link rel="stylesheet" href="assets/style.css?v=profilefix1">
<style>
.profile-page{max-width:1500px;margin:0 auto}.profile-heading{display:flex;align-items:center;gap:15px;margin:2px 0 22px}.profile-heading-icon,.profile-icon{display:grid;place-items:center;background:#eeeaff;color:#6246ea;border-radius:15px;flex:0 0 auto}.profile-heading-icon{width:62px;height:62px;font-size:28px}.profile-heading h2{margin:0 0 5px;font-size:32px;color:#111c3a}.profile-heading p,.profile-card-title p{margin:0;color:#71809a}.profile-columns{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,.9fr);gap:20px;align-items:start}.profile-card{background:#fff;border:1px solid #e8edf7;border-radius:20px;padding:24px;box-shadow:0 8px 28px #1d2d5a0d;min-width:0}.profile-card-title{display:flex;align-items:center;gap:12px;margin-bottom:20px}.profile-icon{width:46px;height:46px;font-size:22px}.profile-card-title h3{margin:0 0 5px;font-size:21px;color:#111c3a}.profile-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px}.profile-fields label,.profile-goal-label{display:block;font-size:13px;font-weight:800;color:#19233d}.profile-fields input,.profile-fields select,.profile-goal-label input{width:100%;box-sizing:border-box;margin-top:8px;padding:13px 14px;border:1px solid #dce3f0;border-radius:12px;background:#fff;color:#24314c;font:inherit;font-weight:500;min-height:50px}.profile-fields input:focus,.profile-fields select:focus,.profile-goal-label input:focus{outline:0;border-color:#7862f0;box-shadow:0 0 0 3px #7862f022}.profile-goal-label{display:block;margin-top:18px}.profile-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.profile-actions button{border:0;border-radius:12px;padding:13px 19px;font:inherit;font-weight:800;cursor:pointer;min-height:47px}.profile-save{background:linear-gradient(135deg,#6948f5,#7e5cf4);color:#fff}.profile-cancel{background:#f0f3f8;color:#475570}.profile-save:disabled{opacity:.65;cursor:wait}.profile-message{display:none;margin-top:16px;padding:12px 14px;border-radius:11px;font-size:14px;overflow-wrap:anywhere}.profile-message.success{display:block;color:#087c43;background:#e7faef;border:1px solid #b7f0ce}.profile-message.error{display:block;color:#bd3434;background:#fff0f0;border:1px solid #ffd1d1}.profile-summary-list{display:grid}.profile-summary-row{display:grid;grid-template-columns:38px minmax(70px,.8fr) minmax(0,1.2fr);gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #edf0f6}.profile-summary-row:last-child{border-bottom:0}.summary-icon{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:#e7f3ff;color:#1474df}.summary-label{color:#748099;font-size:13px}.summary-value{text-align:right;overflow-wrap:anywhere;color:#1b2744;font-weight:750;font-size:13px}.profile-quick{display:flex;align-items:center;gap:12px;text-decoration:none!important;border-radius:13px;padding:13px;margin-top:10px}.profile-quick strong,.profile-quick small{display:block}.profile-quick strong{font-size:13px;margin-bottom:4px}.profile-quick small{font-size:11px}.profile-quick .arrow{margin-left:auto;font-size:22px}.quick-purple{background:#f0edff;color:#5d3de0}.quick-blue{background:#e7f4ff;color:#096bcb}.quick-green{background:#e7faef;color:#087c43}[hidden]{display:none!important}
@media(max-width:1050px){.profile-columns{grid-template-columns:1fr}}@media(max-width:620px){.profile-fields{grid-template-columns:1fr}.profile-card{padding:18px}.profile-heading h2{font-size:26px}.profile-summary-row{grid-template-columns:36px minmax(60px,.8fr) minmax(0,1.2fr);gap:8px}}
</style></head><body>
<script src="assets/app.js?v=profilefix1"></script><script>
(function(){'use strict';
 const page=window.shell('profile','My Profile','');
 if(!page)return;
 const sessionStudent=window.student(); if(!sessionStudent){return;}
 const current={student_id:sessionStudent.student_id??sessionStudent.id??'',name:typeof sessionStudent.name==='string'?sessionStudent.name:'',email:typeof sessionStudent.email==='string'?sessionStudent.email:'',course:typeof sessionStudent.course==='string'?sessionStudent.course:'',year:Number(sessionStudent.year)||1,goal:typeof sessionStudent.goal==='string'?sessionStudent.goal:''};
 page.innerHTML=`<div class="profile-page"><div class="profile-columns"><section class="profile-card"><div class="profile-card-title"><div class="profile-icon">♙</div><div><h3>Student Profile</h3><p>Your profile information and learning preferences.</p></div></div><div id="profileDisplay"><div class="profile-fields"><div><div class="muted small">Full Name</div><h3 id="displayName"></h3></div><div><div class="muted small">Email Address</div><h3 id="displayEmail"></h3></div><div><div class="muted small">Course</div><h3 id="displayCourse"></h3></div><div><div class="muted small">Year of Study</div><h3 id="displayYear"></h3></div><div><div class="muted small">Learning Goal</div><h3 id="displayGoal"></h3></div><div><div class="muted small">Student ID</div><h3 id="displayId"></h3></div></div><div class="profile-actions"><button class="profile-save" id="editProfileButton" type="button">✎ Edit Profile</button></div></div><div id="profileEditPanel" hidden><form id="profileEditForm" novalidate><div class="profile-fields"><label for="profileNameInput">Full Name<input id="profileNameInput" name="name" autocomplete="name" required></label><label for="profileEmailInput">Email Address<input id="profileEmailInput" name="email" type="email" autocomplete="email" required></label><label for="profileCourseInput">Course<input id="profileCourseInput" name="course" required></label><label for="profileYearInput">Year of Study<select id="profileYearInput" name="year"><option value="1">1st Year</option><option value="2">2nd Year</option><option value="3">3rd Year</option><option value="4">4th Year</option><option value="5">5th Year</option><option value="6">6th Year</option><option value="7">7th Year</option><option value="8">8th Year</option></select></label></div><label class="profile-goal-label" for="profileGoalInput">Learning Goal<input id="profileGoalInput" name="goal" placeholder="e.g. Improve programming skills"></label><div class="profile-actions"><button class="profile-save" id="saveProfileButton" type="submit">▣ Save Changes</button><button class="profile-cancel" id="cancelProfileButton" type="button">✕ Cancel</button></div><div id="profileMessage" class="profile-message" role="status" aria-live="polite"></div></form></div></section><aside><section class="profile-card"><div class="profile-card-title"><div class="profile-icon" style="background:#e7f3ff;color:#1474df">▥</div><div><h3>Profile Summary</h3></div></div><div class="profile-summary-list"><div class="profile-summary-row"><div class="summary-icon">▣</div><div class="summary-label">Student ID</div><div class="summary-value" id="summaryId"></div></div><div class="profile-summary-row"><div class="summary-icon" style="background:#f0edff;color:#6348eb">🎓</div><div class="summary-label">Course</div><div class="summary-value" id="summaryCourse"></div></div><div class="profile-summary-row"><div class="summary-icon" style="background:#e7faef;color:#087c43">▦</div><div class="summary-label">Year</div><div class="summary-value" id="summaryYear"></div></div><div class="profile-summary-row"><div class="summary-icon" style="background:#fff0f3;color:#e84b70">◎</div><div class="summary-label">Learning Goal</div><div class="summary-value" id="summaryGoal"></div></div></div></section><section class="profile-card" style="margin-top:20px"><div class="profile-card-title"><div class="profile-icon" style="background:#fff2d9;color:#d98a00">ϟ</div><div><h3>Quick Actions</h3><p>Continue your learning journey.</p></div></div><a class="profile-quick quick-purple" href="ai-recommendations.html"><span>✦</span><span><strong>AI Recommendations</strong><small>Get personalized study suggestions</small></span><span class="arrow">›</span></a><a class="profile-quick quick-blue" href="study-session.html"><span>◷</span><span><strong>Focus Timer</strong><small>Start a study session</small></span><span class="arrow">›</span></a><a class="profile-quick quick-green" href="settings.html"><span>⚙</span><span><strong>Notifications</strong><small>Manage your study reminders</small></span><span class="arrow">›</span></a></section></aside></div></div>`;
 const $=id=>document.getElementById(id); const display=$('profileDisplay'), edit=$('profileEditPanel'), form=$('profileEditForm'), msg=$('profileMessage'), save=$('saveProfileButton');
 function yearLabel(y){const n=Number(y);return n===1?'1st Year':n===2?'2nd Year':n===3?'3rd Year':n+'th Year';}
 function render(){ $('displayName').textContent=current.name||'—';$('displayEmail').textContent=current.email||'—';$('displayCourse').textContent=current.course||'—';$('displayYear').textContent=yearLabel(current.year);$('displayGoal').textContent=current.goal||'Not set';$('displayId').textContent='#'+(current.student_id||'—');$('summaryId').textContent='#'+(current.student_id||'—');$('summaryCourse').textContent=current.course||'—';$('summaryYear').textContent=yearLabel(current.year);$('summaryGoal').textContent=current.goal||'Not set';const topName=document.querySelector('.user-pill strong');if(topName)topName.textContent=current.name||'Student';const avatar=document.querySelector('.user-pill .avatar');if(avatar)avatar.textContent=(current.name||'?').charAt(0).toUpperCase();const topCourse=document.querySelector('.user-pill small');if(topCourse)topCourse.textContent=current.course||''; }
 function fill(){ $('profileNameInput').value=current.name;$('profileEmailInput').value=current.email;$('profileCourseInput').value=current.course;$('profileYearInput').value=String(current.year||1);$('profileGoalInput').value=current.goal; }
 function message(text,type){msg.textContent=text;msg.className='profile-message'+(type?' '+type:'');}
 render();fill();
 $('editProfileButton').addEventListener('click',()=>{fill();message('','');display.hidden=true;edit.hidden=false;$('profileNameInput').focus();});
 $('cancelProfileButton').addEventListener('click',()=>{fill();message('','');edit.hidden=true;display.hidden=false;});
 form.addEventListener('submit',async e=>{e.preventDefault();const value=id=>{const node=$(id);return node&&typeof node.value==='string'?node.value.trim():''};const payload={name:value('profileNameInput'),email:value('profileEmailInput').toLowerCase(),course:value('profileCourseInput'),year:Number($('profileYearInput').value),goal:value('profileGoalInput')};if(!payload.name||!payload.email||!payload.course){message('Please complete your name, email address and course.','error');return;}if(payload.name.length<2){message('Name must contain at least 2 characters.','error');return;}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(payload.email)){message('Please enter a valid email address.','error');return;}if(!Number.isInteger(payload.year)||payload.year<1||payload.year>8){message('Please select a valid year of study.','error');return;}if(current.student_id===''||!Number.isInteger(Number(current.student_id))){message('Student ID is missing from your login session. Please log out and sign in again.','error');return;}save.disabled=true;save.textContent='Saving…';message('','');try{const result=await window.API.put('/profile/'+encodeURIComponent(current.student_id),payload);const updated=result&&result.student?result.student:result; if(!updated||updated.status==='error')throw new Error((updated&&updated.message)||'The server did not confirm the profile update.');Object.assign(current,{student_id:updated.student_id??current.student_id,name:updated.name??payload.name,email:updated.email??payload.email,course:updated.course??payload.course,year:Number(updated.year??payload.year),goal:updated.goal??payload.goal});window.refreshSessionStudent(current);render();fill();message('Profile updated successfully!','success');edit.hidden=true;display.hidden=false;}catch(err){message(err&&err.message?err.message:'Could not update your profile. Check that the backend and MySQL are running.','error');}finally{save.disabled=false;save.textContent='▣ Save Changes';}});
})();
</script></body></html>
