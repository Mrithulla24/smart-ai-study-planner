<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | SmartStudy</title><link rel="stylesheet" href="assets/style.css"></head><body><script src="assets/app.js"></script><script>
const page=shell('dashboard','Dashboard','A live view of your learning performance, priorities and study progress.');
(async()=>{try{const s=student();const [perf,recs,plans,prog,sessions]=await Promise.all([API.get('/performance/'+s.student_id),API.get('/recommendations/'+s.student_id),API.get('/study-plan/'+s.student_id),API.get('/progress/'+s.student_id),API.get('/study-sessions/'+s.student_id)]);const avg=perf.length?Math.round(perf.reduce((a,x)=>a+Number(x.score),0)/perf.length):0;const high=recs.filter(x=>x.priority==='HIGH').length;const studyM=sessions.reduce((a,x)=>a+Number(x.duration_minutes||0),0);const done=prog.reduce((a,x)=>a+Number(x.hours_completed||0),0),rec=prog.reduce((a,x)=>a+Number(x.recommended_hours||0),0),rate=rec?Math.min(100,Math.round(done/rec*100)):0;const good=perf.filter(x=>Number(x.score)>=75).length,mid=perf.filter(x=>Number(x.score)>=60&&Number(x.score)<75).length,low=perf.filter(x=>Number(x.score)<60).length,total=perf.length||1;const g=good/total*100,m=(good+mid)/total*100;const max=Math.max(...perf.map(x=>Number(x.score)),100);
page.innerHTML=`<section class="card hero"><p class="eyebrow">GOOD ${new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</p><h2 style="font-size:27px;margin:0">Welcome back, ${esc(s.name.split(' ')[0])} 👋</h2><p class="muted">Your AI learning pathway is ready. Focus on the highest-priority subjects first.</p><div class="kpi-line"><div><strong>${avg}%</strong><span>AVERAGE SCORE</span></div><div><strong>${high}</strong><span>HIGH PRIORITY</span></div><div><strong>${rate}%</strong><span>STUDY COMPLETION</span></div><div><strong>${(studyM/60).toFixed(1)}h</strong><span>FOCUS TIME</span></div></div></section>
<div class="grid grid-4"><div class="card stat hoverable"><div class="label">Subjects</div><div class="value">${perf.length}</div><div class="sub">Performance records</div></div><div class="card stat hoverable"><div class="label">AI Priorities</div><div class="value">${high}</div><div class="sub">Need extra attention</div></div><div class="card stat hoverable"><div class="label">Active Plans</div><div class="value">${plans.filter(x=>x.status!=='COMPLETED').length}</div><div class="sub">Ready to study</div></div><div class="card stat hoverable"><div class="label">Focus Sessions</div><div class="value">${sessions.length}</div><div class="sub">Timer sessions saved</div></div></div>
<div class="grid grid-2"><section class="card chart-card"><div class="section-head"><div><h2>Performance Distribution</h2><p class="muted small">Score bands across your subjects</p></div><a class="secondary" href="performance.html">Details</a></div><div class="donut" style="background:conic-gradient(#6b63d8 0 ${g}%,#e9b949 ${g}% ${m}%,#e06b6b ${m}% 100%)"><div class="donut-center">${avg}%</div></div><div class="legend"><span><i class="good"></i>Good ${good}</span><span><i class="mid"></i>Average ${mid}</span><span><i class="low"></i>Needs focus ${low}</span></div></section>
<section class="card chart-card"><div class="section-head"><div><h2>Subject Score Graph</h2><p class="muted small">Compare current scores at a glance</p></div></div><div class="mini-chart">${perf.slice(0,8).map(x=>{const score=Number(x.score);return `<div class="bar-col"><div class="bar-value">${score}%</div><div class="bar-stick" style="height:${Math.max(5,score/max*125)}px"></div><div class="bar-label" title="${esc(x.subject_name)}">${esc(x.subject_name)}</div></div>`}).join('')||'<p class="muted">No performance data.</p>'}</div></section></div>
<div class="grid grid-2"><section class="card"><div class="section-head"><div><h2>AI Priorities</h2><p class="muted small">What you should focus on next</p></div><a class="secondary" href="ai-recommendations.html">Open AI</a></div>${recs.slice(0,4).map(x=>`<div class="quick" style="margin-top:11px"><div><strong>${esc(x.subject_name)}</strong><div class="meta">${esc(x.recommendation)}</div></div><span class="badge ${esc(x.priority)}">${esc(x.priority)}</span></div>`).join('')||'<p class="muted">Add performance data to get recommendations.</p>'}</section>
<section class="card"><div class="section-head"><div><h2>Study Progress</h2><p class="muted small">Hours completed versus recommended</p></div><a class="secondary" href="progress.html">View graph</a></div><div class="progress-ring" style="--pct:${rate}%"><div class="ring-text">${rate}%</div></div><p style="text-align:center" class="muted">${done.toFixed(1)} / ${rec.toFixed(1)} hours tracked</p><div class="actions" style="justify-content:center"><a class="primary" href="study-session.html">▶ Start Studying</a><a class="secondary" href="study-planner.html">Open Plan</a></div></section></div>`;
}catch(e){page.innerHTML='<div class="card error">'+esc(e.message)+'</div>'}})();</script></body></html>
