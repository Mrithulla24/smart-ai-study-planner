<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Progress | SmartStudy</title><link rel="stylesheet" href="assets/style.css"></head><body><script src="assets/app.js"></script><script>const page=shell('progress','Progress Analytics','');(async()=>{try{const s=student();const [rows,plans,sessions]=await Promise.all([API.get('/progress/'+s.student_id),API.get('/study-plan/'+s.student_id),API.get('/study-sessions/'+s.student_id)]);const done=rows.reduce((a,x)=>a+Number(x.hours_completed||0),0),rec=rows.reduce((a,x)=>a+Number(x.recommended_hours||0),0),rate=rec?Math.min(100,Math.round(done/rec*100)):0,totalMin=sessions.reduce((a,x)=>a+Number(x.duration_minutes||0),0),completed=rows.filter(x=>x.completion_status==='COMPLETED').length;const bySubject={};rows.forEach(x=>{const k=x.subject_name;bySubject[k]=(bySubject[k]||0)+Number(x.hours_completed||0)});const max=Math.max(...Object.values(bySubject),1);page.innerHTML=`<section class="card hero"><p class="eyebrow">LEARNING ANALYTICS</p><h2 style="margin:0">You are ${rate}% through your tracked study target</h2><p class="muted">Every saved timer session contributes to this dashboard. Keep the streak going.</p></section><div class="grid grid-4"><div class="card stat"><div class="label">Hours Completed</div><div class="value">${done.toFixed(1)}h</div><div class="sub">Saved study time</div></div><div class="card stat"><div class="label">Recommended</div><div class="value">${rec.toFixed(1)}h</div><div class="sub">From study plans</div></div><div class="card stat"><div class="label">Plans Completed</div><div class="value">${completed}</div><div class="sub">Completed records</div></div><div class="card stat"><div class="label">Focus Sessions</div><div class="value">${sessions.length}</div><div class="sub">${(totalMin/60).toFixed(1)} total hours</div></div></div><div class="grid grid-2"><section class="card" style="text-align:center"><h2>Overall Progress</h2><div class="progress-ring" style="--pct:${rate}%"><div class="ring-text">${rate}%</div></div><p class="muted">${done.toFixed(1)} / ${rec.toFixed(1)} recommended hours</p></section><section class="card"><h2>Study Hours by Subject</h2><p class="muted small">A visual comparison of your completed study time.</p><div class="mini-chart">${Object.entries(bySubject).map(([name,v])=>`<div class="bar-col"><div class="bar-value">${v.toFixed(1)}h</div><div class="bar-stick" style="height:${Math.max(5,v/max*125)}px"></div><div class="bar-label" title="${esc(name)}">${esc(name)}</div></div>`).join('')||'<p class="muted">Start a timer session to see your graph.</p>'}</div></section></div><section class="card"><div class="section-head"><div><h2>Update Progress</h2><p class="muted small">You can manually record progress, or simply use the Focus Timer.</p></div><a class="primary" href="study-session.html">▶ Start Timer</a></div><form id="progressForm"><div class="form-grid"><label>Study Plan<select id="plan_id" required><option value="">Select a plan</option>${plans.map(x=>`<option value="${x.plan_id}">${esc(x.subject_name)} — ${x.recommended_hours}h/week</option>`).join('')}</select></label><label>Hours Completed<input id="hours_completed" type="number" min="0" step="0.5" required></label></div><label>Status<select id="completion_status"><option value="PARTIAL">PARTIAL</option><option value="COMPLETED">COMPLETED</option></select></label><button class="primary" type="submit" style="width:auto">Save Progress</button><p id="msg"></p></form></section><section class="card"><h2>Progress Records</h2><div class="table-wrap" style="margin-top:12px"><table class="table"><thead><tr><th>Subject</th><th>Completed</th><th>Target</th><th>Progress</th><th>Status</th><th>Date</th></tr></thead><tbody>${rows.map(x=>{const pct=x.recommended_hours?Math.min(100,Math.round(Number(x.hours_completed)/Number(x.recommended_hours)*100)):0;return `<tr><td><strong>${esc(x.subject_name)}</strong><div class="small muted">${esc(x.topic)}</div></td><td>${x.hours_completed}h</td><td>${x.recommended_hours}h</td><td style="min-width:150px"><div class="bar"><span style="width:${pct}%"></span></div><div class="small muted">${pct}%</div></td><td><span class="badge ${esc(x.completion_status)}">${esc(x.completion_status)}</span></td><td>${esc(x.progress_date)}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">No progress yet. Start studying to create your first record.</td></tr>'}</tbody></table></div></section>`;document.getElementById('progressForm').onsubmit=async e=>{e.preventDefault();try{const r=await API.post('/progress',{student_id:s.student_id,plan_id:Number(document.getElementById('plan_id').value),hours_completed:Number(document.getElementById('hours_completed').value),completion_status:document.getElementById('completion_status').value,progress_date:new Date().toISOString().slice(0,10)});document.getElementById('msg').innerHTML='<div class="success">'+esc(r.message)+'</div>';setTimeout(()=>location.reload(),600)}catch(x){document.getElementById('msg').innerHTML='<div class="error">'+esc(x.message)+'</div>'}}}catch(e){page.innerHTML='<div class="card error">'+esc(e.message)+'</div>'}})();</script></body></html>
