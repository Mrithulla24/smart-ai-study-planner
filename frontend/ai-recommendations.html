<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Recommendations | SmartStudy</title><link rel="stylesheet" href="assets/style.css"></head><body><script src="assets/app.js"></script><script>const page=shell('recommendations','AI Recommendations','Your performance is converted into a clear, actionable learning pathway.');(async()=>{try{const rows=await API.get('/recommendations/'+student().student_id);page.innerHTML=`<section class="card hero"><p class="eyebrow">AI LEARNING COACH</p><h2 style="margin:0">Your next best study actions</h2><p class="muted">Start a focused timer directly from any recommendation. Your completed session is saved to MySQL and reflected on the Progress page.</p></section><div class="grid grid-2">${rows.map(x=>`<article class="card hoverable"><div class="section-head"><div><div class="subject-title">${esc(x.subject_name)}</div><div class="meta">${esc(x.topic)}</div></div><span class="badge ${esc(x.priority)}">${esc(x.priority)} PRIORITY</span></div><div class="grid grid-3" style="margin-top:18px"><div><div class="small muted">Current Score</div><strong>${x.score}%</strong></div><div><div class="small muted">Recommended Focus</div><strong>${x.recommended_hours} hrs/week</strong></div><div><div class="small muted">Trend</div><strong>${Number(x.score)-Number(x.previous_score)>=0?'↗ Improving':'↘ Needs review'}</strong></div></div><div class="recommendation" style="margin-top:17px;padding:13px;background:#f8f7ff;border-radius:11px"><strong>AI says:</strong> ${esc(x.recommendation)}</div><div class="actions" style="margin-top:18px"><a class="primary" href="study-session.html?subject_id=${x.subject_id}">▶ Start Studying</a><a class="secondary" href="study-planner.html">View Plan</a></div></article>`).join('')||'<div class="card"><p class="muted">No recommendations yet. Add performance data first.</p></div>'}</div>`}catch(e){page.innerHTML='<div class="card error">'+esc(e.message)+'</div>'}})();</script></body></html>
