<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | SmartStudy</title><link rel="stylesheet" href="assets/style.css"></head><body><script src="assets/app.js"></script><script>const page=shell('settings','Notifications','');(async()=>{try{const s=student(),st=await API.get('/notifications/'+student().student_id);page.innerHTML=`<div class="grid grid-2"><section class="card"><h2>Notification Preferences</h2><p class="muted small"></p><form id="form"><label class="toggle"><input id="email_enabled" type="checkbox" ${st.email_enabled?'checked':''}> Enable Email Notifications</label><label>Email Address<input id="email" type="email" value="${esc(st.email||s.email)}"></label><label class="toggle"><input id="sms_enabled" type="checkbox" ${st.sms_enabled?'checked':''}> Enable Mobile/SMS Notifications</label><label>Mobile Number<input id="mobile" type="tel" value="${esc(st.mobile||'')}" placeholder="+919876543210"></label><label>Reminder Interval (minutes)<input id="reminder_minutes" type="number" min="5" value="${Number(st.reminder_minutes||30)}"></label><div class="actions"><button class="primary" type="submit">Save Settings</button><button class="secondary" type="button" id="test">Send Test Now</button></div><p id="msg"></p></form></section><section class="card"><h2>How it works</h2><div class="quick"><div><strong>✉ Email</strong><div class="meta">Works with Gmail/Outlook/any SMTP server.</div></div><span>1</span></div><div class="quick" style="margin-top:10px"><div><strong>📱 Mobile SMS</strong><div class="meta">Works with a Twilio account and verified sender.</div></div><span>2</span></div><div class="quick" style="margin-top:10px"><div><strong>✓ Test before demo</strong><div class="meta">Use Send Test Now and confirm the message arrives.</div></div><span>3</span></div></section></div>`;form.onsubmit=async e=>{e.preventDefault();try{const r=await API.post('/notifications',{student_id:s.student_id,email_enabled:email_enabled.checked,sms_enabled:sms_enabled.checked,email:email.value.trim(),mobile:mobile.value.trim(),reminder_minutes:Number(reminder_minutes.value)});msg.innerHTML='<div class="success">'+esc(r.message)+'</div>'}catch(x){msg.innerHTML='<div class="error">'+esc(x.message)+'</div>'}};test.onclick=async()=>{try{await form.requestSubmit();const r=await API.post('/notifications/test/'+s.student_id,{});msg.innerHTML='<div class="success">'+esc(r.message)+'</div>'+(r.errors?.length?'<div class="error">'+esc(r.errors.join(' | '))+'</div>':'')}catch(x){msg.innerHTML='<div class="error">'+esc(x.message)+'</div>'}}}catch(e){page.innerHTML='<div class="card error">'+esc(e.message)+'</div>'}})();</script></body></html>
