<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Timer | SmartStudy</title><link rel="stylesheet" href="assets/style.css"></head><body><script src="assets/app.js"></script><script>const page=shell('session','Focus Study Room','');(async()=>{try{const s=student();const [plans,sessions,recs]=await Promise.all([API.get('/study-plan/'+s.student_id),API.get('/study-sessions/'+s.student_id),API.get('/recommendations/'+s.student_id)]);const q=new URLSearchParams(location.search),preSubject=q.get('subject_id'),prePlan=q.get('plan_id');page.innerHTML=`<div class="grid grid-2"><section class="card timer-wrap"><p class="eyebrow">FOCUS MODE</p><h2>Deep Study Session</h2><p class="muted">Pick a subject, start the timer, and save when you finish.</p><label style="text-align:left">Study Plan<select id="plan"><option value="">General study session</option>${plans.map(x=>`<option value="${x.plan_id}" data-subject="${x.subject_id}">${esc(x.subject_name)} — ${x.recommended_hours}h/week</option>`).join('')}</select></label><div class="timer" id="timer">00:00:00</div><div class="timer-target" id="target">Ready when you are.</div><div class="actions" style="justify-content:center;margin-top:22px"><button class="primary" id="start">▶ Start</button><button class="secondary" id="pause" disabled>Ⅱ Pause</button><button class="ghost" id="reset">↺ Reset</button><button class="primary" id="save">✓ Save Session</button></div><div id="saveMsg" style="margin-top:16px"></div></section><section class="card"><h2>AI Focus Suggestions</h2><p class="muted small">Choose a high-priority subject when possible.</p>${recs.slice(0,5).map(x=>`<div class="quick" style="margin-top:10px"><div><strong>${esc(x.subject_name)}</strong><div class="meta">${esc(x.recommendation)}</div></div><span class="badge ${esc(x.priority)}">${esc(x.priority)}</span></div>`).join('')||'<p class="muted">No AI recommendations yet.</p>'}</section></div><section class="card"><div class="section-head"><div><h2>Recent Focus Sessions</h2></div><a class="secondary" href="progress.html">View Progress</a></div><div class="session-list" style="margin-top:13px">${sessions.slice(0,8).map(x=>`<div class="session-item"><div><strong>${esc(x.subject_name||'General Study')}</strong><div class="small muted">${new Date(x.session_date).toLocaleString()}</div></div><strong>${Number(x.duration_minutes).toFixed(1)} min</strong></div>`).join('')||'<p class="muted">No sessions saved yet.</p>'}</div></section>`;const plan=document.getElementById('plan'),timer=document.getElementById('timer'),target=document.getElementById('target'),start=document.getElementById('start'),pause=document.getElementById('pause'),reset=document.getElementById('reset'),save=document.getElementById('save');if(prePlan)plan.value=prePlan;else if(preSubject){const opt=[...plan.options].find(o=>o.dataset.subject===preSubject);if(opt)plan.value=opt.value}let sec=0,interval=null;function render(){const h=String(Math.floor(sec/3600)).padStart(2,'0'),m=String(Math.floor(sec%3600/60)).padStart(2,'0'),s2=String(sec%60).padStart(2,'0');timer.textContent=h+':'+m+':'+s2;target.textContent=sec?Math.floor(sec/60)+' minutes focused':'Ready when you are.'}start.onclick=()=>{if(interval)return;interval=setInterval(()=>{sec++;render()},1000);start.disabled=true;pause.disabled=false;start.classList.add('pulse');target.textContent='Stay focused — you are doing great!'};pause.onclick=()=>{clearInterval(interval);interval=null;start.disabled=false;pause.disabled=true;start.classList.remove('pulse');target.textContent='Paused. Continue when ready.'};reset.onclick=()=>{clearInterval(interval);interval=null;sec=0;start.disabled=false;pause.disabled=true;start.classList.remove('pulse');render()};save.onclick=async()=>{if(sec<30){document.getElementById('saveMsg').innerHTML='<div class="error">Study for at least 30 seconds before saving.</div>';return}try{clearInterval(interval);const o=plan.options[plan.selectedIndex];const r=await API.post('/study-sessions',{student_id:s.student_id,plan_id:o.value?Number(o.value):null,subject_id:o.dataset.subject?Number(o.dataset.subject):null,duration_minutes:Number((sec/60).toFixed(2)),status:'COMPLETED'});document.getElementById('saveMsg').innerHTML='<div class="success">'+esc(r.message)+' Your progress has been saved.</div>';setTimeout(()=>location.reload(),700)}catch(e){document.getElementById('saveMsg').innerHTML='<div class="error">'+esc(e.message)+'</div>'}};plan.onchange=()=>{const o=plan.options[plan.selectedIndex];target.textContent=o.value?'Selected: '+o.textContent:'Ready when you are.'};render();}catch(e){page.innerHTML='<div class="card error">'+esc(e.message)+'</div>'}})();</script></body></html>
